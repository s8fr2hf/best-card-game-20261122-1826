<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Sigils — a duel of sigil cards</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="table">
  <header id="topbar">
    <div id="foe-box" class="fighter">
      <div class="fighter-name">Mira the Gale Witch <span class="tag">AI</span></div>
      <div class="lifebar"><div id="foe-life-fill" class="life-fill foe"></div><span id="foe-life-text" class="life-text"></span></div>
      <div id="foe-shield" class="shield-line"></div>
    </div>
    <div id="turn-banner">Turn 1</div>
    <div id="score-box">
      <div class="score-row"><span>Wins</span><b id="score-wins">0</b></div>
      <div class="score-row"><span>Losses</span><b id="score-losses">0</b></div>
      <div class="score-row"><span>Duels</span><b id="score-duels">0</b></div>
    </div>
  </header>

  <section id="foe-hand" aria-label="Opponent hand"></section>
  <div id="foe-label" class="hand-label">Mira's hand · <span id="foe-count">5</span> cards</div>

  <section id="arena">
    <div id="foe-played" class="played-slot"></div>
    <div id="clash">
      <div id="clash-text">The duel begins.</div>
      <div id="resonance"></div>
    </div>
    <div id="you-played" class="played-slot"></div>
  </section>

  <div id="you-label" class="hand-label">Your hand · <span id="you-count">5</span> cards · click a card or press 1–7 to play it</div>
  <section id="you-hand" aria-label="Your hand"></section>

  <footer id="bottombar">
    <div id="you-box" class="fighter">
      <div class="fighter-name">You · Sigil Keeper</div>
      <div class="lifebar"><div id="you-life-fill" class="life-fill you"></div><span id="you-life-text" class="life-text"></span></div>
      <div id="you-shield" class="shield-line"></div>
    </div>
    <div id="mana-box">
      <div class="mana-label">Mana</div>
      <div id="mana-pips"></div>
      <div id="mana-text" class="mana-text"></div>
    </div>
    <div id="controls">
      <button id="end-turn" type="button">End turn <kbd>E</kbd></button>
      <button id="restart" type="button">New duel <kbd>R</kbd></button>
    </div>
  </footer>

  <aside id="log" aria-label="Duel log"></aside>
</div>

<div id="overlay" class="overlay">
  <div class="overlay-card">
    <h1 id="overlay-title">EMBER SIGILS</h1>
    <p id="overlay-sub">A duel of sigil cards</p>
    <div id="overlay-body"></div>
    <button id="overlay-btn" type="button">Begin the duel</button>
    <p class="hint">Click a card to play it · keys 1–7 play cards · E ends your turn · R starts a new duel</p>
  </div>
</div>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
